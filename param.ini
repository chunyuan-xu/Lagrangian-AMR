# Sedov-AMR efficiency benchmark: L4-L7 Distance AMR, t=1, 0.05-time outputs.
# Canonical G1/G3 runners override these values and restore this file byte-for-byte.
which_case = 1
start_time = 0.0
end_time = 1.0
delta_time = 1e-5
minus_level = 4
max_level = 7
max_time_step = 100000
# Gradient-AMR thresholds; ignored when refine_coarsen_enum = 5 (Distance).
refine_err = 1.0
coarsen_error = 0.8
refine_coarsen_enum = 5
# Distance-AMR: R_s(t) = scale * t^exponent; refine/coarsen band half-width.
distance_shock_radius_scale = 1.0
distance_shock_radius_exponent = 0.5
distance_band_half_width = 0.04
refine_coarsen_time = 0.0
refine_period = 1
write_interval_time = 0.05
write_interval_step = 200000
enable_amr = true
